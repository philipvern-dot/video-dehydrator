name: Bug report
description: Something in Video Dehydrator didn't work right.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. A few details help a lot.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan a folder with...
        2. Click Convert...
  - type: input
    id: version
    attributes:
      label: Video Dehydrator version
      placeholder: "1.0.4"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: log
    attributes:
      label: Log or error text (optional)
      render: text
